name: Daily Python Scraper Automated Run

on:
  schedule:
    - cron: "45 11 * * *"  # Runs every day at 11:45 UTC
  workflow_dispatch:       # (optional) allows manual trigger from GitHub UI

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug by Listing repository structure
        run: ls -R .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install beautifulsoup4
          pip install supabase
          pip install rapidfuzz

      - name: Run Python script
        working-directory: ./Scraper
        run: python scrape_daily_events.py
